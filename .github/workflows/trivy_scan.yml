name: Trivy Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Scan application image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build application image
        run: |
          docker build \
            --tag preordingfoodapp:ci \
            .

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.5
        with:
          version: v0.72.0

      - name: Verify Trivy
        run: trivy --version

      - name: Download Trivy vulnerability database
        run: trivy image --download-db-only

      - name: Create output directory
        run: mkdir -p "GitHub Actions/Trivy Automation"

      - name: Scan application image
        id: trivy-scan
        continue-on-error: true
        run: |
          trivy image \
            --format json \
            --ignore-unfixed \
            --vuln-type os,library \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --output "GitHub Actions/Trivy Automation/scan-results.json" \
            preordingfoodapp:ci

      - name: Verify scan results
        if: always()
        run: |
          ls -lh "GitHub Actions/Trivy Automation/"
          test -f "GitHub Actions/Trivy Automation/scan-results.json"

      - name: Upload Trivy scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: "GitHub Actions/Trivy Automation/scan-results.json"
          if-no-files-found: error

      - name: Enforce Trivy security gate
        if: steps.trivy-scan.outcome == 'failure'
        run: |
          echo "Trivy found HIGH or CRITICAL vulnerabilities."
          exit 1