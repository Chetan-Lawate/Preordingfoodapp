name: Trivy Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Scan application image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build application image
        run: |
          docker build \
            --tag preordingfoodapp:ci \
            .

      - name: Install Trivy
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin v0.57.0

      - name: Scan application image
        run: |
          mkdir -p "GitHub Actions/Trivy Automation"

          trivy image \
            --format json \
            --ignore-unfixed \
            --vuln-type os,library \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --output "GitHub Actions/Trivy Automation/scan-results.json" \
            preordingfoodapp:ci

      - name: Upload Trivy scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: 'GitHub Actions/Trivy Automation/scan-results.json'