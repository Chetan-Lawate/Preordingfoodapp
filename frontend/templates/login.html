{% extends 'base.html' %}

{% block title %}Sign In | CampusBites Pre-Order App{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12 sm:py-16">

  <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-xl">
    
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-600 to-orange-400 text-white font-extrabold text-2xl flex items-center justify-center mx-auto mb-3 shadow-md">
        ⚡
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900">Welcome Back</h1>
      <p class="text-slate-500 text-xs mt-1">Sign in to pre-order food and track active orders.</p>
    </div>

    <!-- Quick Demo Logins Box -->
    <div class="mb-6 p-3.5 bg-orange-50/80 rounded-2xl border border-orange-200/60 text-xs">
      <span class="block font-bold text-brand-700 mb-2">💡 Quick Demo Logins:</span>
      <div class="grid grid-cols-2 gap-2">
        <button type="button" onclick="fillCredentials('student@cafeteria.com', 'student123')" class="px-2.5 py-1.5 rounded-xl bg-white border border-orange-200 text-slate-700 font-bold hover:bg-orange-100 text-[11px] transition">
          👤 Student Demo
        </button>
        <button type="button" onclick="fillCredentials('admin@cafeteria.com', 'admin123')" class="px-2.5 py-1.5 rounded-xl bg-slate-900 text-white font-bold hover:bg-slate-800 text-[11px] transition">
          ⚡ Admin Demo
        </button>
      </div>
    </div>

    <form method="POST" action="{{ url_for('login', next=request_args.get('next', '')) }}" class="space-y-4">
      <div>
        <label for="email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="student@cafeteria.com"
               class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition">
      </div>

      <div>
        <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••"
               class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition">
      </div>

      <div class="flex items-center justify-between text-xs pt-1">
        <label class="flex items-center gap-2 cursor-pointer text-slate-600 font-medium">
          <input type="checkbox" name="remember" class="w-4 h-4 rounded text-brand-500 focus:ring-brand-500 border-slate-300">
          Remember me
        </label>
      </div>

      <button type="submit" class="w-full py-3.5 rounded-2xl bg-brand-500 hover:bg-brand-600 text-white font-extrabold text-sm shadow-md shadow-brand-500/25 transition mt-2">
        Sign In ➔
      </button>
    </form>

    <div class="mt-6 pt-6 border-t border-slate-100 text-center text-xs text-slate-500">
      Don't have an account yet? 
      <a href="{{ url_for('register') }}" class="font-bold text-brand-600 hover:underline ml-1">Create Account</a>
    </div>

  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
function fillCredentials(email, password) {
  document.getElementById('email').value = email;
  document.getElementById('password').value = password;
}
</script>
{% endblock %}
