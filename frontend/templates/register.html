{% extends 'base.html' %}

{% block title %}Create Account | CampusBites Pre-Order App{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12 sm:py-16">

  <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-xl">
    
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-600 to-orange-400 text-white font-extrabold text-2xl flex items-center justify-center mx-auto mb-3 shadow-md">
        ✨
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900">Create New Account</h1>
      <p class="text-slate-500 text-xs mt-1">Register to start pre-ordering meals for your breaks.</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}" class="space-y-4">
      <div>
        <label for="username" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Full Name / Username</label>
        <input type="text" id="username" name="username" required placeholder="Alex Johnson"
               class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition">
      </div>

      <div>
        <label for="email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="alex@campus.edu"
               class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition">
      </div>

      <div>
        <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
        <input type="password" id="password" name="password" required placeholder="Create strong password"
               class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition">
      </div>

      <div>
        <label for="role" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Account Role</label>
        <select id="role" name="role" class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-slate-50 text-sm font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500">
          <option value="user" selected>Student / Employee (Customer)</option>
          <option value="admin">Cafeteria Admin (Kitchen Staff)</option>
        </select>
      </div>

      <button type="submit" class="w-full py-3.5 rounded-2xl bg-brand-500 hover:bg-brand-600 text-white font-extrabold text-sm shadow-md shadow-brand-500/25 transition mt-2">
        Register Account ➔
      </button>
    </form>

    <div class="mt-6 pt-6 border-t border-slate-100 text-center text-xs text-slate-500">
      Already have an account? 
      <a href="{{ url_for('login') }}" class="font-bold text-brand-600 hover:underline ml-1">Sign In</a>
    </div>

  </div>

</div>
{% endblock %}
